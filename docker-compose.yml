services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sentinelx
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: sentinelx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./apps/api
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://sentinelx:sentinelx@postgres:5432/sentinelx?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  # web dev: cd apps/web && npm run dev (proxy /api -> :8080)

volumes:
  pgdata:
